appId: io.github.barryshen1.meetingcopilot
productName: MeetingCopilot
copyright: Copyright © 2025 JWM0203

directories:
  buildResources: build
  output: release

# Only the compiled bundles ship. Production node_modules are added by
# electron-builder itself (it walks the prod dependency tree separately), so
# they must NOT be listed here. The negative patterns below are belt-and-braces
# documentation of what must never reach a user's disk -- docs/ alone carries a
# 6.8 MB demo video plus GIFs.
files:
  - out/**
  - package.json
  - '!src/**'
  - '!test/**'
  - '!docs/**'
  - '!tools/**'
  - '!patches/**'
  - '!build/**'
  - '!.github/**'
  - '!**/*.md'
  - '!**/*.tsbuildinfo'
  - '!electron.vite.config.ts'
  - '!tsconfig*.json'
  - '!**/{.npmrc,.editorconfig,start.bat,start-funasr-local.bat}'

asar: true
# @huggingface/transformers is loaded through a dynamic ESM import of
# transformers.node.mjs (electron/asr/engine.ts); an app.asar file:// URL is not
# importable, and the silent CJS fallback would drop our cache_position patch.
# onnxruntime-node carries native .node/.dll payloads. electron-builder already
# auto-unpacks module roots containing native binaries, but onnxruntime-node is
# pinned explicitly so a future detector change cannot break local Whisper.
asarUnpack:
  - node_modules/@huggingface/transformers/**
  - node_modules/onnxruntime-node/**

# Python sidecar scripts must live on the real filesystem (spawned by a Python
# interpreter, never through Electron's asar shim). Packaged layout:
#   resources/tools/*.py           <- getResourceRoot() + 'tools'
#   resources/requirements-*.txt
# funasr_stream_server.py imports funasr_device, moss_asr_server.py imports
# moss_asr_utils -- sibling imports resolved via the script directory, so all
# four files must land in the same folder.
extraResources:
  - from: tools
    to: tools
    filter:
      - funasr_stream_server.py
      - funasr_device.py
      - moss_asr_server.py
      - moss_asr_utils.py
  - from: requirements-funasr.txt
    to: requirements-funasr.txt
  - from: requirements-moss.txt
    to: requirements-moss.txt
  # Connection-test fixtures (electron/providerTest.ts): a ~1.4 s 16 kHz mono
  # TTS clip per language and a 64x64 PNG. They carry no user data. The `to`
  # path mirrors the repo-relative path on purpose -- getResourceRoot() is the
  # repo root in dev and `resources/` when packaged, so
  # join(root, 'resources', ...) resolves on both sides with no branch.
  - from: resources/test-audio
    to: resources/test-audio
    filter:
      - '*.wav'
  - from: resources/test-image.png
    to: resources/test-image.png
  # System-tray icons (electron/tray.ts). Same mirrored-path trick as the test
  # fixtures above: trayIconPath() joins getResourceRoot() + 'resources/tray',
  # which is the repo folder in dev and this one once packaged.
  - from: resources/tray
    to: resources/tray
    filter:
      - '*.png'

# Personal Apple-silicon build: ad-hoc signing needs no Developer ID credentials.
# This is a local-use build, not a notarized release. No publishing is configured.
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  minimumSystemVersion: '14.0'
  artifactName: ${productName}-${version}-mac-${arch}-adhoc.${ext}
  target:
    - target: zip
      arch:
        - arm64
  identity: '-'
  hardenedRuntime: true
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # tools/build-mac-audio.mjs compiles the native helpers here (对方 system
  # audio, 📷 window capture); they must sit on the real filesystem (spawned,
  # never read through asar) and are signed with the app like every other
  # Mach-O in the bundle.
  extraResources:
    - from: resources/bin
      to: resources/bin
      filter:
        - mc-system-audio
        - mc-window-shot
  extendInfo:
    NSMicrophoneUsageDescription: MeetingCopilot uses your selected audio input to transcribe speech when you start recording.
    NSAudioCaptureUsageDescription: MeetingCopilot records what your Mac is playing (the other party in a meeting) to transcribe it. It never uses your microphone for this.
    NSScreenCaptureUsageDescription: MeetingCopilot captures the window you are working in only when you ask a screenshot question (📷 or 框选).

win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MeetingCopilot
  # meeting notes, sessions and API keys live in %APPDATA%\MeetingCopilot --
  # an uninstall (or an upgrade, which uninstalls first) must never wipe them
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
